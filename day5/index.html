<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load and search a list of users.</p>
    </header>

    <main>
      <section aria-labelledby="users-heading">
        <h2 id="users-heading">Users</h2>

        <button id="load-users" type="button">Load Users</button>

        <p id="status" role="status" aria-live="polite">
          Click "Load Users" to get started.
        </p>

        <label for="filter-input">Filter users by name</label>
        <input type="text" id="filter-input" placeholder="Enter a name..." />

        <ul id="users-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 User Directory</p>
    </footer>
  </body>
</html>
